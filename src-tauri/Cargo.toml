[package]
name = "logicuitry"
version = "0.1.0"
description = "Teaching instruments for logic circuits and design."
edition = "2021"
rust-version = "1.77"

[lib]
name = "logicuitry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# The whole reason the desktop port exists: WebView2 drops a persisted
# directory permission across app restarts, so the browser file layer's
# "grant once, restore silently" contract breaks without this.
tauri-plugin-persisted-scope = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
